spring.application.name=ff-forum
server.port=8080

# H2 em memoria - simples, sem MySQL
spring.datasource.url=jdbc:h2:mem:ffdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Inicializa schema.sql e data.sql automaticamente
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
